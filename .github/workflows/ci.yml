version: 0.2

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin 624858524166.dkr.ecr.us-east-2.amazonaws.com

  build:
    commands:
      - echo Building Docker image...
      - docker build -t aws-instance-repo .

  post_build:
    commands:
      - echo Tagging Docker image...
      - docker tag aws-instance-repo:latest 624858524166.dkr.ecr.us-east-2.amazonaws.com/aws-instance-repo:latest
      - echo Pushing Docker image...
      - docker push 624858524166.dkr.ecr.us-east-2.amazonaws.com/aws-instance-repo:latest
